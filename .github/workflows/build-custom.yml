name: Build Custom Image

on:
  push:
    branches:
      - '2026.6.5-custom'

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate version tag
        id: version
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-6)
          LOCK_HASH=$(sha256sum pnpm-lock.yaml | cut -c1-8)
          echo "tag=2026.6.5-custom.${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "lock_hash=${LOCK_HASH}" >> "$GITHUB_OUTPUT"
          echo "Building tag: 2026.6.5-custom.${SHORT_SHA} (lock: ${LOCK_HASH})"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/senorsen/openclaw-fork:${{ steps.version.outputs.tag }}
            ${{ env.REGISTRY }}/senorsen/openclaw-fork:custom-latest
          cache-from: type=gha,scope=build-${{ steps.version.outputs.lock_hash }}
          cache-to: type=gha,mode=max,scope=build-${{ steps.version.outputs.lock_hash }}
