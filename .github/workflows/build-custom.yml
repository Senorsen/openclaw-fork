name: Build Custom Image

on:
  push:
    branches:
      - "2026.5.18-custom"

env:
  REGISTRY: ghcr.io

jobs:
  verify-inbound:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-env
        with:
          pnpm-version: "11.1.0"
      - name: Telegram ingress and busy-queue regressions
        env:
          OPENCLAW_VITEST_MAX_WORKERS: "2"
        run: |
          node scripts/run-vitest.mjs run --config test/vitest/vitest.extension-telegram.config.ts extensions/telegram/src/bot.steer-delivery.test.ts extensions/telegram/src/steer-preview-complete.test.ts extensions/telegram/src/bot.create-telegram-bot.channel-post-media.test.ts
          node scripts/run-vitest.mjs run --config test/vitest/vitest.auto-reply.config.ts src/auto-reply/inbound.test.ts src/auto-reply/reply/queue.drain-restart.test.ts src/auto-reply/reply/queue.dedupe.test.ts

  build:
    needs: verify-inbound
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate version tag
        id: version
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-6)
          LOCK_HASH=$(sha256sum pnpm-lock.yaml | cut -c1-8)
          echo "tag=2026.5.18-custom.${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "lock_hash=${LOCK_HASH}" >> "$GITHUB_OUTPUT"
          echo "Building tag: 2026.5.18-custom.${SHORT_SHA} (lock: ${LOCK_HASH})"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/senorsen/openclaw-fork:${{ steps.version.outputs.tag }}
            ${{ env.REGISTRY }}/senorsen/openclaw-fork:custom-latest
          no-cache: true
