name: Build compaction cancellation fix
on:
  push:
    branches: [fix/compaction-20261030]
    paths:
      - 'tools/compaction-fix/**'
      - '.github/workflows/build-compaction-fix.yml'
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and verify pinned runtime overlay
        run: |
          set -eux
          image=ghcr.io/senorsen/openclaw-fork:2026.5.18-compaction-${GITHUB_SHA:0:8}
          docker build --pull -t "$image" tools/compaction-fix
          docker run --rm --entrypoint node "$image" /opt/compaction-fix-20261030/verify.mjs /app
          docker run --rm --entrypoint node "$image" /app/dist/index.js --version
          docker run --rm --entrypoint node "$image" --version
          docker push "$image"
          echo "IMAGE=$image" >> "$GITHUB_STEP_SUMMARY"
