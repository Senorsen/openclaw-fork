name: Build SSH Overlay Image

on:
  push:
    branches:
      - "2026.7.1-2-ssh"
    paths:
      - Dockerfile.ssh-overlay
      - .github/workflows/build-ssh-overlay.yml
  workflow_dispatch:

env:
  IMAGE: ghcr.io/senorsen/openclaw-fork:2026.7.1-2-ssh
  BASE_IMAGE: ghcr.io/openclaw/openclaw:2026.7.1-2

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build pinned SSH overlay
        run: |
          set -euo pipefail
          docker build --memory=3g \
            --build-arg BASE_IMAGE="$BASE_IMAGE" \
            -f Dockerfile.ssh-overlay \
            -t "$IMAGE" .

      - name: Verify OpenClaw and SSH client
        run: |
          set -euo pipefail
          docker run --rm "$IMAGE" openclaw --version
          docker run --rm --entrypoint ssh "$IMAGE" -V

      - name: Push pinned image
        run: docker push "$IMAGE"
