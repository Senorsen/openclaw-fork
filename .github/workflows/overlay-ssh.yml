name: Overlay SSH on Official Image

on:
  workflow_dispatch:
    inputs:
      base_tag:
        description: 'Official openclaw Docker tag to overlay (e.g. 2026.7.3)'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  OFFICIAL_IMAGE: ghcr.io/openclaw/openclaw
  TARGET_IMAGE: ghcr.io/senorsen/openclaw-fork

jobs:
  overlay:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Dockerfile
        run: |
          cat > Dockerfile.overlay << 'EOF'
          ARG BASE_TAG
          FROM ghcr.io/openclaw/openclaw:${BASE_TAG}
          USER root
          RUN apt-get update && apt-get install -y --no-install-recommends openssh-client && rm -rf /var/lib/apt/lists/*
          USER node
          EOF

      - name: Build and push
        run: |
          TAG="${{ inputs.base_tag }}-ssh"
          docker build \
            --build-arg BASE_TAG="${{ inputs.base_tag }}" \
            -f Dockerfile.overlay \
            -t "${{ env.TARGET_IMAGE }}:${TAG}" \
            -t "${{ env.TARGET_IMAGE }}:latest-ssh" \
            .
          docker push "${{ env.TARGET_IMAGE }}:${TAG}"
          docker push "${{ env.TARGET_IMAGE }}:latest-ssh"
          echo "✅ Pushed ${{ env.TARGET_IMAGE }}:${TAG}"
