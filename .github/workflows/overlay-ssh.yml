name: Overlay SSH on Official Image

on:
  workflow_dispatch:
    inputs:
      base_tag:
        description: 'Official openclaw Docker tag (e.g. 2026.6.11)'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  OFFICIAL_IMAGE: ghcr.io/openclaw/openclaw
  TARGET_IMAGE: ghcr.io/senorsen/openclaw-fork

jobs:
  overlay:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build overlay image
        run: |
          BASE="${{ env.OFFICIAL_IMAGE }}:${{ inputs.base_tag }}"
          TAG="${{ inputs.base_tag }}-ssh"
          echo "FROM ${BASE}" > Dockerfile
          echo "USER root" >> Dockerfile
          echo "RUN apt-get update && apt-get install -y --no-install-recommends openssh-client && rm -rf /var/lib/apt/lists/*" >> Dockerfile
          echo "USER node" >> Dockerfile
          echo "Building ${TAG} from ${BASE}..."
          docker build -t "${{ env.TARGET_IMAGE }}:${TAG}" -t "${{ env.TARGET_IMAGE }}:latest-ssh" .

      - name: Push
        run: |
          TAG="${{ inputs.base_tag }}-ssh"
          docker push "${{ env.TARGET_IMAGE }}:${TAG}"
          docker push "${{ env.TARGET_IMAGE }}:latest-ssh"
          echo "✅ Pushed ${{ env.TARGET_IMAGE }}:${TAG} and latest-ssh"
